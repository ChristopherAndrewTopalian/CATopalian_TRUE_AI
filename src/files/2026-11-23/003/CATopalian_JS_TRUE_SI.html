<script>

// ===
// shortcuts.js
// ===
function ge(whichId)
{
    let result = document.getElementById(whichId);
    return result;
}

function ce(whichType)
{
    let result = document.createElement(whichType);
    return result;
}

function ba(whichElement)
{
    let result = document.body.append(whichElement);
    return result;
}

function cl(whichText)
{
    let result = console.log(whichText);
    return result;
}

function ct(whichText)
{
    let result = document.createTextNode(whichText);
    return result;
}

//----//

// ===
// 16 BOOLEAN LOGIC GATES
// ===
function tau(a, b)
{
    if ((a == 0 && b == 0) || (a == 0 && b == 1) || (a == 1 && b == 0) || (a == 1 && b == 1))
    {
        return 1;
    }
    else
    {
        return 1;
    }
}

function con(a, b)
{
    if ((a == 0 && b == 0) || (a == 0 && b == 1) || (a == 1 && b == 0) || (a == 1 && b == 1))
    {
        return 0;
    }
    else
    {
        return 0;
    }
}

function xor(a, b)
{
    if ((a == 1 && b == 0) || (a == 0 && b == 1))
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function xnor(a, b)
{
    if ((a == 0 && b == 0) || (a == 1 && b == 1))
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function and(a, b)
{
    if (a == 1 && b == 1)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function nand(a, b)
{
    if (a == 0 || b == 0)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function or(a, b)
{
    if (a == 1 || b == 1)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function nor(a, b)
{
    if (a == 0 && b == 0)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function mi(a, b)
{
    if (a == 0 || b == 1)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function mni(a, b)
{
    if (a == 1 && b == 0)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function ci(a, b)
{
    if (a == 1 || b == 0)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function cni(a, b)
{
    if (a == 0 && b == 1)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function lp(a, b)
{
    if (a == 1)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function lc(a, b)
{
    if (a == 0)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function rp(a, b)
{
    if ((a == 0 && b == 1) || (a == 1 && b == 1))
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function rc(a, b)
{
    if ((a == 0 && b == 0) || (a == 1 && b == 0))
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

//----//

// ===
// CORE SYSTEM OPERATIONS (Flip-Flop, Recursion, Tri-State, Clock)
// ===

// 1. SR Flip-Flop (Pure input -> output state latch)
function flipFlop(currentState, set, reset)
{
    if (reset == 1)
    {
        return 0; // Empty the latch
    }
    else if (set == 1)
    {
        return 1; // Fill and hold the latch
    }

    // Hold existing state when both set and reset are 0
    return currentState;
}

// 2. Recursion (Feeds NAND gate output back into itself on next cycle)
function recursionCycle(externalInput, previousFeedback)
{
    let nextFeedback = nand(externalInput, previousFeedback);
    return nextFeedback;
}

// 3. Tri-State Buffer (Passes signal when enabled, returns null 'Z' when disabled)
function triStateBuffer(input, enable)
{
    if (enable == 1)
    {
        return input;
    }
    else
    {
        return null;
    }
}

// 4. Clock Controls
let fps = 1;
let frameDuration = 1000 / fps;
let pulseTimer;
let clockPulse = 0;
let counter = 0;

function startClock(speedInMilliseconds)
{
    clearInterval(pulseTimer);

    pulseTimer = setInterval(function()
    {
        counter++;
        clockPulse = clockPulse === 1 ? 0 : 1;
        runSystemCycle();
    }, speedInMilliseconds);
}

function stopClock()
{
    clearInterval(pulseTimer);
}

//----//

// ===
// 16-GON DIAGRAM DATA (Clockwise starting at Top 12:00)
// ===
let logicGatesData = [
    { name: 'Tautology',     bits: '1111', fn: tau,  opposite: 'Contradiction', color: 'rgb(0, 255, 255)' },
    { name: 'CI',            bits: '1011', fn: ci,   opposite: 'CNI',           color: 'rgb(255, 210, 220)' },
    { name: 'NOR',           bits: '1000', fn: nor,  opposite: 'OR',            color: 'rgb(0, 255, 0)' },
    { name: 'RP',            bits: '0101', fn: rp,   opposite: 'RC',            color: 'rgb(255, 165, 0)' },
    { name: 'XNOR',          bits: '1001', fn: xnor, opposite: 'XOR',           color: 'rgb(0, 255, 255)' },
    { name: 'LC',            bits: '1100', fn: lc,   opposite: 'LP',            color: 'rgb(255, 165, 0)' },
    { name: 'NAND',          bits: '1110', fn: nand, opposite: 'AND',           color: 'rgb(0, 255, 0)' },
    { name: 'MNI',           bits: '0010', fn: mni,  opposite: 'MI',            color: 'rgb(255, 210, 220)' },
    { name: 'Contradiction', bits: '0000', fn: con,  opposite: 'Tautology',     color: 'rgb(0, 255, 255)' },
    { name: 'CNI',           bits: '0100', fn: cni,  opposite: 'CI',            color: 'rgb(255, 210, 220)' },
    { name: 'OR',            bits: '0111', fn: or,   opposite: 'NOR',           color: 'rgb(0, 255, 0)' },
    { name: 'RC',            bits: '1010', fn: rc,   opposite: 'RP',            color: 'rgb(255, 165, 0)' },
    { name: 'XOR',           bits: '0110', fn: xor,  opposite: 'XNOR',          color: 'rgb(0, 255, 255)' },
    { name: 'LP',            bits: '0011', fn: lp,   opposite: 'LC',            color: 'rgb(255, 165, 0)' },
    { name: 'AND',           bits: '0001', fn: and,  opposite: 'NAND',          color: 'rgb(0, 255, 0)' },
    { name: 'MI',            bits: '1101', fn: mi,   opposite: 'MNI',           color: 'rgb(255, 210, 220)' }
];

let diagramChords = [
    { from: 0,  to: 8,  color: 'rgb(0, 255, 255)' },
    { from: 4,  to: 12, color: 'rgb(0, 255, 255)' },
    { from: 2,  to: 10, color: 'rgb(0, 255, 0)' },
    { from: 6,  to: 14, color: 'rgb(0, 255, 0)' },
    { from: 3,  to: 11, color: 'rgb(255, 165, 0)' },
    { from: 5,  to: 13, color: 'rgb(255, 165, 0)' },
    { from: 1,  to: 9,  color: 'rgb(255, 210, 220)' },
    { from: 7,  to: 15, color: 'rgb(255, 210, 220)' },

    { from: 14, to: 2,  color: 'rgb(0, 255, 0)' },
    { from: 2,  to: 6,  color: 'rgb(0, 255, 0)' },
    { from: 6,  to: 10, color: 'rgb(0, 255, 0)' },
    { from: 10, to: 14, color: 'rgb(0, 255, 0)' },

    { from: 13, to: 3,  color: 'rgb(255, 165, 0)' },
    { from: 3,  to: 5,  color: 'rgb(255, 165, 0)' },
    { from: 5,  to: 11, color: 'rgb(255, 165, 0)' },
    { from: 11, to: 13, color: 'rgb(255, 165, 0)' },

    { from: 15, to: 1,  color: 'rgb(255, 210, 220)' },
    { from: 1,  to: 7,  color: 'rgb(255, 210, 220)' },
    { from: 7,  to: 9,  color: 'rgb(255, 210, 220)' },
    { from: 9,  to: 15, color: 'rgb(255, 210, 220)' }
];

//----//

// ===
// SYSTEM STATE & DICTIONARY
// ===
let memoryLatch = 0;
let feedbackState = 0;

let knownWords = [
    {
        word: 'hi',
        meaning: 'greeting'
    },
    {
        word: 'weather',
        meaning: 'environment condition'
    }
];

//----//

// ===
// INTERFACE
// ===
function manualResetLatch()
{
    memoryLatch = flipFlop(memoryLatch, 0, 1);
    ge('textInput').value = '';
    runSystemCycle();
}

function makeInterface()
{
    let layout = ce('div');
    layout.style.display = 'flex';
    layout.style.gap = '24px';
    layout.style.alignItems = 'flex-start';
    ba(layout);

    let leftPanel = ce('div');
    leftPanel.style.width = '360px';
    layout.append(leftPanel);

    let label = ce('div');
    label.textContent = 'Input (try: hi, weather, or reset):';
    label.style.marginBottom = '8px';
    leftPanel.append(label);

    let textInput = ce('textarea');
    textInput.id = 'textInput';
    leftPanel.append(textInput);

    // Clock & Flip-Flop Controls
    let controls = ce('div');
    leftPanel.append(controls);

    let startBtn = ce('button');
    startBtn.textContent = 'Start Clock';
    startBtn.onclick = function()
    {
        startClock(frameDuration);
    };
    controls.append(startBtn);

    let stopBtn = ce('button');
    stopBtn.textContent = 'Stop Clock';
    stopBtn.onclick = function()
    {
        stopClock();
    };
    controls.append(stopBtn);

    let resetBtn = ce('button');
    resetBtn.textContent = 'Reset Latch';
    resetBtn.onclick = function()
    {
        manualResetLatch();
    };
    controls.append(resetBtn);

    let readout = ce('div');
    readout.id = 'readout';
    readout.style.marginTop = '16px';
    readout.style.lineHeight = '1.6';
    leftPanel.append(readout);

    let canvas = ce('canvas');
    canvas.id = 'diagramCanvas';
    canvas.width = 760;
    canvas.height = 760;
    layout.append(canvas);
}

//----//

// ===
// MODULAR PIPELINE FUNCTIONS (Input -> Output)
// ===

function listenForText(whichId)
{
    let element = ge(whichId);

    if (!element)
    {
        return '';
    }

    return element.value.trim();
}

function tokenizeWords(whichText)
{
    if (whichText === '')
    {
        return [];
    }

    let cleanText = whichText.toLowerCase().replace(/[^\w\s]/g, '');

    if (cleanText.trim() === '')
    {
        return [];
    }

    return cleanText.trim().split(/\s+/);
}

function findKnownWords(whichWords, whichDictionary)
{
    let foundMatches = [];

    for (let i = 0; i < whichWords.length; i++)
    {
        for (let j = 0; j < whichDictionary.length; j++)
        {
            if (whichWords[i] === whichDictionary[j].word)
            {
                foundMatches.push(whichDictionary[j]);
                break;
            }
        }
    }

    return foundMatches;
}

function extractMeanings(whichMatches)
{
    let meanings = [];

    for (let i = 0; i < whichMatches.length; i++)
    {
        meanings.push(whichMatches[i].meaning);
    }

    return meanings;
}

// Checks if the user typed 'reset' or 'clear' to empty the SR Flip-Flop
function checkResetSignal(whichWords)
{
    for (let i = 0; i < whichWords.length; i++)
    {
        if (whichWords[i] === 'reset' || whichWords[i] === 'clear')
        {
            return 1;
        }
    }

    return 0;
}

function matchesToBinary(whichMatches)
{
    if (whichMatches.length > 0)
    {
        return 1;
    }

    return 0;
}

function evaluate16Gates(a, b, whichGates)
{
    let results = [];

    for (let i = 0; i < whichGates.length; i++)
    {
        let gate = whichGates[i];

        results.push({
            index: i,
            name: gate.name,
            bits: gate.bits,
            fn: gate.fn,
            opposite: gate.opposite,
            color: gate.color,
            value: gate.fn(a, b)
        });
    }

    return results;
}

// Routes 4 competing state channels through Tri-State Buffers onto 1 shared bus
function evaluateTriStateBus(a, b)
{
    let channels = [
        { gate: 'NOR (0,0)', output: triStateBuffer('IDLE: Waiting for known input', nor(a, b)) },
        { gate: 'MNI (1,0)', output: triStateBuffer('NEW: Input detected, setting latch', mni(a, b)) },
        { gate: 'AND (1,1)', output: triStateBuffer('ACTIVE: Live input + latched memory', and(a, b)) },
        { gate: 'CNI (0,1)', output: triStateBuffer('HELD: Input cleared, latch holding memory', cni(a, b)) }
    ];

    let activeMessage = 'Z (High-Impedance)';

    for (let i = 0; i < channels.length; i++)
    {
        if (channels[i].output !== null)
        {
            activeMessage = channels[i].output;
            break;
        }
    }

    return {
        activeMessage: activeMessage,
        channels: channels
    };
}

//----//

// ===
// VISUAL RENDERING (16-Gon + Center Hub Pulse)
// ===
function getNodePosition(index, centerX, centerY, radius)
{
    let angle = -Math.PI / 2 + (index * (2 * Math.PI / 16));

    return {
        x: centerX + Math.cos(angle) * radius,
        y: centerY + Math.sin(angle) * radius
    };
}

function drawRectangularVenn(ctx, centerX, centerY, a, b, gateFn)
{
    let cellPairs = [
        [1, 0],
        [1, 1],
        [0, 1],
        [0, 0]
    ];

    let cellW = 11;
    let cellH = 16;
    let totalW = cellW * 4;
    let startX = centerX - (totalW / 2);
    let startY = centerY - (cellH / 2);

    ctx.strokeStyle = 'rgb(255, 255, 255)';
    ctx.lineWidth = 2;
    ctx.strokeRect(startX - 2, startY - 2, totalW + 4, cellH + 4);

    for (let i = 0; i < 4; i++)
    {
        let pairA = cellPairs[i][0];
        let pairB = cellPairs[i][1];
        let isTrue = gateFn(pairA, pairB) == 1;

        ctx.fillStyle = isTrue ? 'rgb(0, 120, 255)' : 'rgb(255, 255, 255)';
        ctx.fillRect(startX + (i * cellW), startY, cellW - 1, cellH);

        if (pairA == a && pairB == b)
        {
            ctx.strokeStyle = 'rgb(255, 255, 0)';
            ctx.lineWidth = 2;
            ctx.strokeRect(startX + (i * cellW), startY, cellW - 1, cellH);
        }
    }
}

function renderDiagram(a, b, evaluatedGates, pulse, feedback)
{
    let canvas = ge('diagramCanvas');

    if (!canvas)
    {
        return;
    }

    let ctx = canvas.getContext('2d');
    let centerX = canvas.width / 2;
    let centerY = canvas.height / 2;
    let ringRadius = 215;
    let labelRadius = 285;
    let iconRadius = 335;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Outer yellow ring
    ctx.beginPath();
    ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgb(255, 255, 0)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Internal chords
    for (let i = 0; i < diagramChords.length; i++)
    {
        let chord = diagramChords[i];
        let p1 = getNodePosition(chord.from, centerX, centerY, ringRadius);
        let p2 = getNodePosition(chord.to, centerX, centerY, ringRadius);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = chord.color;
        ctx.lineWidth = 2.5;
        ctx.stroke();
    }

    // Center hub reflects Clock Pulse (outer ring) and Recursion Feedback (core)
    ctx.beginPath();
    ctx.arc(centerX, centerY, pulse == 1 ? 15 : 10, 0, Math.PI * 2);
    ctx.fillStyle = feedback == 1 ? 'rgb(255, 105, 180)' : 'rgb(90, 40, 70)';
    ctx.fill();
    ctx.strokeStyle = pulse == 1 ? 'rgb(0, 255, 255)' : 'rgb(255, 255, 255)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 16 outer gate nodes, labels, and Venn icons
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let i = 0; i < evaluatedGates.length; i++)
    {
        let gate = evaluatedGates[i];
        let nodePos = getNodePosition(i, centerX, centerY, ringRadius);
        let labelPos = getNodePosition(i, centerX, centerY, labelRadius);
        let iconPos = getNodePosition(i, centerX, centerY, iconRadius);

        ctx.beginPath();
        ctx.arc(nodePos.x, nodePos.y, gate.value == 1 ? 9 : 6, 0, Math.PI * 2);
        ctx.fillStyle = gate.value == 1 ? 'rgb(255, 255, 0)' : 'rgb(20, 20, 20)';
        ctx.fill();
        ctx.strokeStyle = gate.value == 1 ? 'rgb(255, 255, 255)' : 'rgb(255, 255, 0)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = gate.value == 1 ? gate.color : 'rgb(120, 120, 120)';
        ctx.fillText(gate.name, labelPos.x, labelPos.y - 8);
        ctx.fillText(gate.bits, labelPos.x, labelPos.y + 8);

        drawRectangularVenn(ctx, iconPos.x, iconPos.y, a, b, gate.fn);
    }
}

function updateReadout(a, b, words, meanings, busData)
{
    let readout = ge('readout');

    if (!readout)
    {
        return;
    }

    let channelLines = '';

    for (let i = 0; i < busData.channels.length; i++)
    {
        let ch = busData.channels[i];
        let isOpen = ch.output !== null;
        let statusColor = isOpen ? 'rgb(0, 255, 0)' : 'rgb(130, 130, 130)';
        let statusText = isOpen ? 'OPEN -> ' + ch.output : 'Z (null / disconnected)';

        channelLines += '<div style="color:' + statusColor + '; font-size:14px;">' +
            ch.gate + ': ' + statusText + '</div>';
    }

    readout.innerHTML =
        '<div>Clock Tick: ' + counter + ' | Pulse: ' + clockPulse + '</div>' +
        '<div>Input A (Live Word): ' + a + '</div>' +
        '<div>Input B (SR Flip-Flop Latch): ' + b + '</div>' +
        '<div>Recursion NAND Feedback: ' + feedbackState + '</div>' +
        '<div>Words: ' + (words.length > 0 ? words.join(', ') : 'none') + '</div>' +
        '<div>Meanings: ' + (meanings.length > 0 ? meanings.join(', ') : 'none') + '</div>' +
        '<div style="margin-top: 10px; color: rgb(0, 255, 255);">Tri-State Bus Output:<br>' +
        busData.activeMessage + '</div>' +
        '<div style="margin-top: 10px;">Tri-State Channels:</div>' +
        channelLines;
}

//----//

// ===
// MAIN CYCLE (Orchestrated by Clock)
// ===
function runSystemCycle()
{
    // 1. Parse text input
    let spokenText = listenForText('textInput');
    let words = tokenizeWords(spokenText);
    let matches = findKnownWords(words, knownWords);
    let meanings = extractMeanings(matches);

    // 2. Compute Set and Reset signals for the SR Flip-Flop
    let setSignal = matchesToBinary(matches);
    let resetSignal = checkResetSignal(words);

    // 3. Update Flip-Flop Latch BEFORE evaluating the 16 gates
    memoryLatch = flipFlop(memoryLatch, setSignal, resetSignal);

    // 4. Input A = Live Input, Input B = Latched Memory
    let a = setSignal;
    let b = memoryLatch;

    // 5. Run Recursion Feedback cycle
    feedbackState = recursionCycle(a, feedbackState);

    // 6. Evaluate all 16 Boolean gates and route Tri-State Bus
    let evaluatedGates = evaluate16Gates(a, b, logicGatesData);
    let busData = evaluateTriStateBus(a, b);

    // 7. Render Canvas and Readout
    renderDiagram(a, b, evaluatedGates, clockPulse, feedbackState);
    updateReadout(a, b, words, meanings, busData);
}

function whenLoaded()
{
    makeInterface();
    runSystemCycle();
    startClock(frameDuration);
}

</script>
