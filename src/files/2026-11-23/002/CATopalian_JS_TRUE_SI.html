<head>
<title> CATopalian JS TRUE SI </title>

<meta charset = 'UTF-8'>
<meta name = 'viewport' content = 'width = device-width, initial-scale = 1.0'>

<style>

body
{
    background-color: rgb(30, 30, 30);
    font-family: Arial;
    font-size: 18px;
    font-weight: bold;
    color: rgb(255, 255, 255);
    margin: 20px;
}

textarea
{
    width: 320px;
    height: 90px;
    background-color: rgb(20, 20, 20);
    color: rgb(255, 255, 255);
    border: 2px solid rgb(0, 255, 255);
    font-family: Arial;
    font-size: 18px;
    font-weight: bold;
    padding: 8px;
}

canvas
{
    background-color: rgb(15, 15, 15);
    border: 2px solid rgb(80, 80, 80);
}

</style>

<script>

// ===
// shortcuts.js
// ===
function ge(whichId)
{
    let result = document.getElementById(whichId);
    return result;
}

function ce(whichType)
{
    let result = document.createElement(whichType);
    return result;
}

function ba(whichElement)
{
    let result = document.body.append(whichElement);
    return result;
}

function cl(whichText)
{
    let result = console.log(whichText);
    return result;
}

function ct(whichText)
{
    let result = document.createTextNode(whichText);
    return result;
}

//----//

// ===
// 16 BOOLEAN LOGIC GATES
// ===
function tau(a, b)
{
    if ((a == 0 && b == 0) || (a == 0 && b == 1) || (a == 1 && b == 0) || (a == 1 && b == 1))
    {
        return 1;
    }
    else
    {
        return 1;
    }
}

function con(a, b)
{
    if ((a == 0 && b == 0) || (a == 0 && b == 1) || (a == 1 && b == 0) || (a == 1 && b == 1))
    {
        return 0;
    }
    else
    {
        return 0;
    }
}

function xor(a, b)
{
    if ((a == 1 && b == 0) || (a == 0 && b == 1))
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function xnor(a, b)
{
    if ((a == 0 && b == 0) || (a == 1 && b == 1))
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function and(a, b)
{
    if (a == 1 && b == 1)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function nand(a, b)
{
    if (a == 0 || b == 0)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function or(a, b)
{
    if (a == 1 || b == 1)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function nor(a, b)
{
    if (a == 0 && b == 0)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function mi(a, b)
{
    if (a == 0 || b == 1)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function mni(a, b)
{
    if (a == 1 && b == 0)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function ci(a, b)
{
    if (a == 1 || b == 0)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function cni(a, b)
{
    if (a == 0 && b == 1)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function lp(a, b)
{
    if (a == 1)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function lc(a, b)
{
    if (a == 0)
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function rp(a, b)
{
    if ((a == 0 && b == 1) || (a == 1 && b == 1))
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

function rc(a, b)
{
    if ((a == 0 && b == 0) || (a == 1 && b == 0))
    {
        return 1;
    }
    else
    {
        return 0;
    }
}

//----//

// ===
// 16-GON DIAGRAM DATA (Clockwise starting at Top 12:00)
// ===
let logicGatesData = [
    { name: 'Tautology',     bits: '1111', fn: tau,  opposite: 'Contradiction', color: 'rgb(0, 255, 255)' },
    { name: 'CI',            bits: '1011', fn: ci,   opposite: 'CNI',           color: 'rgb(255, 210, 220)' },
    { name: 'NOR',           bits: '1000', fn: nor,  opposite: 'OR',            color: 'rgb(0, 255, 0)' },
    { name: 'RP',            bits: '0101', fn: rp,   opposite: 'RC',            color: 'rgb(255, 165, 0)' },
    { name: 'XNOR',          bits: '1001', fn: xnor, opposite: 'XOR',           color: 'rgb(0, 255, 255)' },
    { name: 'LC',            bits: '1100', fn: lc,   opposite: 'LP',            color: 'rgb(255, 165, 0)' },
    { name: 'NAND',          bits: '1110', fn: nand, opposite: 'AND',           color: 'rgb(0, 255, 0)' },
    { name: 'MNI',           bits: '0010', fn: mni,  opposite: 'MI',            color: 'rgb(255, 210, 220)' },
    { name: 'Contradiction', bits: '0000', fn: con,  opposite: 'Tautology',     color: 'rgb(0, 255, 255)' },
    { name: 'CNI',           bits: '0100', fn: cni,  opposite: 'CI',            color: 'rgb(255, 210, 220)' },
    { name: 'OR',            bits: '0111', fn: or,   opposite: 'NOR',           color: 'rgb(0, 255, 0)' },
    { name: 'RC',            bits: '1010', fn: rc,   opposite: 'RP',            color: 'rgb(255, 165, 0)' },
    { name: 'XOR',           bits: '0110', fn: xor,  opposite: 'XNOR',          color: 'rgb(0, 255, 255)' },
    { name: 'LP',            bits: '0011', fn: lp,   opposite: 'LC',            color: 'rgb(255, 165, 0)' },
    { name: 'AND',           bits: '0001', fn: and,  opposite: 'NAND',          color: 'rgb(0, 255, 0)' },
    { name: 'MI',            bits: '1101', fn: mi,   opposite: 'MNI',           color: 'rgb(255, 210, 220)' }
];

// Color-coded internal chord pairs matching your 16-gon diagram
let diagramChords = [
    // Diameters through center pink hub (exact opposites)
    { from: 0,  to: 8,  color: 'rgb(0, 255, 255)' },
    { from: 4,  to: 12, color: 'rgb(0, 255, 255)' },
    { from: 2,  to: 10, color: 'rgb(0, 255, 0)' },
    { from: 6,  to: 14, color: 'rgb(0, 255, 0)' },
    { from: 3,  to: 11, color: 'rgb(255, 165, 0)' },
    { from: 5,  to: 13, color: 'rgb(255, 165, 0)' },
    { from: 1,  to: 9,  color: 'rgb(255, 210, 220)' },
    { from: 7,  to: 15, color: 'rgb(255, 210, 220)' },

    // Green family box (AND, NOR, NAND, OR)
    { from: 14, to: 2,  color: 'rgb(0, 255, 0)' },
    { from: 2,  to: 6,  color: 'rgb(0, 255, 0)' },
    { from: 6,  to: 10, color: 'rgb(0, 255, 0)' },
    { from: 10, to: 14, color: 'rgb(0, 255, 0)' },

    // Orange family box (LP, RP, LC, RC)
    { from: 13, to: 3,  color: 'rgb(255, 165, 0)' },
    { from: 3,  to: 5,  color: 'rgb(255, 165, 0)' },
    { from: 5,  to: 11, color: 'rgb(255, 165, 0)' },
    { from: 11, to: 13, color: 'rgb(255, 165, 0)' },

    // Pink family box (MI, CI, MNI, CNI)
    { from: 15, to: 1,  color: 'rgb(255, 210, 220)' },
    { from: 1,  to: 7,  color: 'rgb(255, 210, 220)' },
    { from: 7,  to: 9,  color: 'rgb(255, 210, 220)' },
    { from: 9,  to: 15, color: 'rgb(255, 210, 220)' }
];

//----//

// ===
// DATA & MEMORY STATE
// ===
let fps = 1;
let frameDuration = 1000 / fps;
let keepThinking;
let counter = 0;

let previousSignal = 0;

let knownWords = [
    {
        word: 'hi',
        meaning: 'greeting'
    },
    {
        word: 'weather',
        meaning: 'environment condition'
    }
];

//----//

// ===
// INTERFACE
// ===
function makeInterface()
{
    let layout = ce('div');
    layout.style.display = 'flex';
    layout.style.gap = '24px';
    layout.style.alignItems = 'flex-start';
    ba(layout);

    // Left panel: Text Input & Live Readout
    let leftPanel = ce('div');
    layout.append(leftPanel);

    let label = ce('div');
    label.textContent = 'Speak (try typing: hi, weather):';
    label.style.marginBottom = '8px';
    leftPanel.append(label);

    let textInput = ce('textarea');
    textInput.id = 'textInput';
    leftPanel.append(textInput);

    let readout = ce('div');
    readout.id = 'readout';
    readout.style.marginTop = '16px';
    readout.style.lineHeight = '1.6';
    leftPanel.append(readout);

    // Right panel: 16-Gon Canvas
    let canvas = ce('canvas');
    canvas.id = 'diagramCanvas';
    canvas.width = 760;
    canvas.height = 760;
    layout.append(canvas);
}

//----//

// ===
// MODULAR PIPELINE FUNCTIONS (Input -> Output)
// ===

// 1. INPUT: element id | OUTPUT: raw trimmed string
function listenForText(whichId)
{
    let element = ge(whichId);

    if (!element)
    {
        return '';
    }

    return element.value.trim();
}

// 2. INPUT: raw string | OUTPUT: array of clean lowercase words
function tokenizeWords(whichText)
{
    if (whichText === '')
    {
        return [];
    }

    let cleanText = whichText.toLowerCase().replace(/[^\w\s]/g, '');

    if (cleanText.trim() === '')
    {
        return [];
    }

    let wordArray = cleanText.trim().split(/\s+/);
    return wordArray;
}

// 3. INPUT: array of words + dictionary | OUTPUT: array of matching objects
function findKnownWords(whichWords, whichDictionary)
{
    let foundMatches = [];

    for (let i = 0; i < whichWords.length; i++)
    {
        for (let j = 0; j < whichDictionary.length; j++)
        {
            if (whichWords[i] === whichDictionary[j].word)
            {
                foundMatches.push(whichDictionary[j]);
                break;
            }
        }
    }

    return foundMatches;
}

// 4. INPUT: matching objects | OUTPUT: array of meanings
function extractMeanings(whichMatches)
{
    let meanings = [];

    for (let i = 0; i < whichMatches.length; i++)
    {
        meanings.push(whichMatches[i].meaning);
    }

    return meanings;
}

// 5. INPUT: matches array | OUTPUT: binary 1 or 0 for Input A
function matchesToBinary(whichMatches)
{
    if (whichMatches.length > 0)
    {
        return 1;
    }

    return 0;
}

// 6. INPUT: a, b, gates array | OUTPUT: evaluated array of all 16 gates
function evaluate16Gates(a, b, whichGates)
{
    let results = [];

    for (let i = 0; i < whichGates.length; i++)
    {
        let gate = whichGates[i];
        let output = gate.fn(a, b);

        results.push({
            index: i,
            name: gate.name,
            bits: gate.bits,
            fn: gate.fn,
            opposite: gate.opposite,
            color: gate.color,
            value: output
        });
    }

    return results;
}

// 7. INPUT: a, b | OUTPUT: human-readable state label
function describeState(a, b)
{
    if (nor(a, b) == 1)
    {
        return 'QUIET (0, 0) - Waiting for known words';
    }
    if (mni(a, b) == 1)
    {
        return 'NEW INPUT (1, 0) - Word just arrived';
    }
    if (and(a, b) == 1)
    {
        return 'SUSTAINED (1, 1) - Word held in memory';
    }
    if (cni(a, b) == 1)
    {
        return 'RELEASED (0, 1) - Input cleared, fading from memory';
    }

    return '';
}

//----//

// ===
// VISUAL RENDERING (16-Gon + Rectangular Venn Icons)
// ===
function getNodePosition(index, centerX, centerY, radius)
{
    let angle = -Math.PI / 2 + (index * (2 * Math.PI / 16));

    return {
        x: centerX + Math.cos(angle) * radius,
        y: centerY + Math.sin(angle) * radius,
        angle: angle
    };
}

function drawRectangularVenn(ctx, centerX, centerY, a, b, gateFn)
{
    // 4 segments matching your diagram: [A only (1,0) | Both (1,1) | B only (0,1) | Neither (0,0)]
    let cellPairs = [
        [1, 0],
        [1, 1],
        [0, 1],
        [0, 0]
    ];

    let cellW = 11;
    let cellH = 16;
    let totalW = cellW * 4;
    let startX = centerX - (totalW / 2);
    let startY = centerY - (cellH / 2);

    // Outer white frame
    ctx.strokeStyle = 'rgb(255, 255, 255)';
    ctx.lineWidth = 2;
    ctx.strokeRect(startX - 2, startY - 2, totalW + 4, cellH + 4);

    for (let i = 0; i < 4; i++)
    {
        let pairA = cellPairs[i][0];
        let pairB = cellPairs[i][1];
        let isTrue = gateFn(pairA, pairB) == 1;

        ctx.fillStyle = isTrue ? 'rgb(0, 120, 255)' : 'rgb(255, 255, 255)';
        ctx.fillRect(startX + (i * cellW), startY, cellW - 1, cellH);

        // Highlight the currently active (a, b) cell in yellow
        if (pairA == a && pairB == b)
        {
            ctx.strokeStyle = 'rgb(255, 255, 0)';
            ctx.lineWidth = 2;
            ctx.strokeRect(startX + (i * cellW), startY, cellW - 1, cellH);
        }
    }
}

function renderDiagram(a, b, evaluatedGates)
{
    let canvas = ge('diagramCanvas');

    if (!canvas)
    {
        return;
    }

    let ctx = canvas.getContext('2d');
    let centerX = canvas.width / 2;
    let centerY = canvas.height / 2;
    let ringRadius = 215;
    let labelRadius = 285;
    let iconRadius = 335;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Draw yellow outer 16-gon circle
    ctx.beginPath();
    ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgb(255, 255, 0)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 2. Draw internal relationship chords
    for (let i = 0; i < diagramChords.length; i++)
    {
        let chord = diagramChords[i];
        let p1 = getNodePosition(chord.from, centerX, centerY, ringRadius);
        let p2 = getNodePosition(chord.to, centerX, centerY, ringRadius);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = chord.color;
        ctx.lineWidth = 2.5;
        ctx.stroke();
    }

    // 3. Draw central pink hub node
    ctx.beginPath();
    ctx.arc(centerX, centerY, 9, 0, Math.PI * 2);
    ctx.fillStyle = 'rgb(255, 105, 180)';
    ctx.fill();

    // 4. Draw all 16 gate nodes, labels, and 4-cell Venn icons
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let i = 0; i < evaluatedGates.length; i++)
    {
        let gate = evaluatedGates[i];
        let nodePos = getNodePosition(i, centerX, centerY, ringRadius);
        let labelPos = getNodePosition(i, centerX, centerY, labelRadius);
        let iconPos = getNodePosition(i, centerX, centerY, iconRadius);

        // Node circle lights up bright when gate outputs 1
        ctx.beginPath();
        ctx.arc(nodePos.x, nodePos.y, gate.value == 1 ? 9 : 6, 0, Math.PI * 2);
        ctx.fillStyle = gate.value == 1 ? 'rgb(255, 255, 0)' : 'rgb(20, 20, 20)';
        ctx.fill();
        ctx.strokeStyle = gate.value == 1 ? 'rgb(255, 255, 255)' : 'rgb(255, 255, 0)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Gate name and bit string
        ctx.fillStyle = gate.value == 1 ? gate.color : 'rgb(120, 120, 120)';
        ctx.fillText(gate.name, labelPos.x, labelPos.y - 8);
        ctx.fillText(gate.bits, labelPos.x, labelPos.y + 8);

        // Rectangular Venn icon
        drawRectangularVenn(ctx, iconPos.x, iconPos.y, a, b, gate.fn);
    }
}

function updateReadout(a, b, words, meanings, evaluatedGates)
{
    let readout = ge('readout');

    if (!readout)
    {
        return;
    }

    let activeNames = [];

    for (let i = 0; i < evaluatedGates.length; i++)
    {
        if (evaluatedGates[i].value == 1)
        {
            activeNames.push(evaluatedGates[i].name);
        }
    }

    readout.innerHTML =
        '<div>Tick: ' + counter + '</div>' +
        '<div>Input A (Current Word): ' + a + '</div>' +
        '<div>Input B (Previous Memory): ' + b + '</div>' +
        '<div style="color: rgb(0, 255, 255);">State: ' + describeState(a, b) + '</div>' +
        '<div>Words: ' + (words.length > 0 ? words.join(', ') : 'none') + '</div>' +
        '<div>Meanings: ' + (meanings.length > 0 ? meanings.join(', ') : 'none') + '</div>' +
        '<div style="margin-top: 10px; color: rgb(255, 255, 0);">Active Gates (8 of 16):<br>' +
        activeNames.join(', ') + '</div>';
}

//----//

// ===
// MAIN LOOP (Orchestrates the pipeline)
// ===
function think()
{
    keepThinking = setInterval(function()
    {
        counter++;

        // 1. Text perception pipeline
        let spokenText = listenForText('textInput');
        let words = tokenizeWords(spokenText);
        let matches = findKnownWords(words, knownWords);
        let meanings = extractMeanings(matches);

        // 2. Binary inputs (A = Now, B = Memory from previous tick)
        let signalNow = matchesToBinary(matches);
        let signalBefore = previousSignal;

        // 3. Evaluate all 16 gates
        let evaluatedGates = evaluate16Gates(signalNow, signalBefore, logicGatesData);

        // 4. Update visual diagram and text readout
        renderDiagram(signalNow, signalBefore, evaluatedGates);
        updateReadout(signalNow, signalBefore, words, meanings, evaluatedGates);

        // 5. Latch current signal into memory for the next tick
        previousSignal = signalNow;

    }, frameDuration);
}

function whenLoaded()
{
    makeInterface();
    think();
}

</script>

</head>

<body onload = 'whenLoaded();'>
